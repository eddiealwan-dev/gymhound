<style>
body{margin:0;background:#06080B}
a{color:#7FD4FF}a:hover{color:#B8E8FF}
:root{--ease:cubic-bezier(0.2,0,0,1)}
.hud{font-family:'Chakra Petch',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.press{transition:scale 150ms var(--ease),background-color 150ms var(--ease),border-color 150ms var(--ease),color 150ms var(--ease)}
.press:active{scale:.96}
.press:focus-visible{outline:2px solid #7FD4FF;outline-offset:2px}

/* rig — one shared clock; every animated part reads --dur and --play */
.rig{animation-duration:var(--dur);animation-play-state:var(--play);animation-iteration-count:infinite;animation-timing-function:linear;transform-box:view-box}
.shinA{transform-origin:150px 380px;animation-name:shin}
.thighA{transform-origin:150px 300px;animation-name:thigh}
.torsoA{transform-origin:150px 215px;animation-name:torso}
@keyframes shin{0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.45,0,.9,.6)}25%{transform:rotate(20deg);animation-timing-function:cubic-bezier(.1,.4,.55,1)}50%{transform:rotate(35deg)}66.67%{transform:rotate(35deg);animation-timing-function:cubic-bezier(.5,0,1,.6)}75%{transform:rotate(20deg);animation-timing-function:cubic-bezier(0,.4,.5,1)}83.33%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}
@keyframes thigh{0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.45,0,.9,.6)}25%{transform:rotate(-75deg);animation-timing-function:cubic-bezier(.1,.4,.55,1)}50%{transform:rotate(-130deg)}66.67%{transform:rotate(-130deg);animation-timing-function:cubic-bezier(.5,0,1,.6)}75%{transform:rotate(-75deg);animation-timing-function:cubic-bezier(0,.4,.5,1)}83.33%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}
@keyframes torso{0%{transform:rotate(0deg);animation-timing-function:cubic-bezier(.45,0,.9,.6)}25%{transform:rotate(77deg);animation-timing-function:cubic-bezier(.1,.4,.55,1)}50%{transform:rotate(117deg)}66.67%{transform:rotate(117deg);animation-timing-function:cubic-bezier(.5,0,1,.6)}75%{transform:rotate(77deg);animation-timing-function:cubic-bezier(0,.4,.5,1)}83.33%{transform:rotate(0deg)}100%{transform:rotate(0deg)}}

/* phase-synced activation: glow follows the work, peaks driving out of the hole */
.pP{animation-name:pulseP}.pS{animation-name:pulseS}.pX{animation-name:pulseX}
@keyframes pulseP{0%{opacity:.2}50%{opacity:.6}66.67%{opacity:.85}72%{opacity:1}83.33%{opacity:.35}100%{opacity:.2}}
@keyframes pulseS{0%{opacity:.1}50%{opacity:.4}72%{opacity:.7}83.33%{opacity:.2}100%{opacity:.1}}
@keyframes pulseX{0%{opacity:.25}50%{opacity:.45}72%{opacity:.55}100%{opacity:.25}}

/* phase readout + cues on the same clock */
.phL{animation-name:phL}.phH{animation-name:phH}.phD{animation-name:phD}.phB{animation-name:phB}
@keyframes phL{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes phH{0%,49%{opacity:0}50%,65.67%{opacity:1}66.67%,100%{opacity:0}}
@keyframes phD{0%,65.67%{opacity:0}66.67%,82.33%{opacity:1}83.33%,100%{opacity:0}}
@keyframes phB{0%,82.33%{opacity:0}83.33%,99%{opacity:1}100%{opacity:0}}
.depth{animation-name:depth}
@keyframes depth{0%,44%{opacity:0;transform:translateY(-6px)}48%,68%{opacity:1;transform:translateY(0)}72%,100%{opacity:0;transform:translateY(-6px)}}
.cueKnee{animation-name:cueKnee}
@keyframes cueKnee{0%,30%{opacity:0}38%,60%{opacity:1}66%,100%{opacity:0}}
.cueDrive{animation-name:cueDrive}
@keyframes cueDrive{0%,64%{opacity:0}68%,84%{opacity:1}88%,100%{opacity:0}}
.fill{transform-origin:0 50%;animation-name:fill}
@keyframes fill{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.ring{animation:ring 8s linear infinite;animation-play-state:var(--play)}
@keyframes ring{to{stroke-dashoffset:-120}}

/* svg strokes kept in CSS */
.gridLine{fill:none;stroke:#132130;stroke-width:.6}
.floor{fill:none;stroke:#1C3448;stroke-width:.8}
.pedestal{fill:none;stroke:#5EC8FF;stroke-opacity:.5;stroke-width:1;stroke-dasharray:4 6}
.parallel{stroke:#FFC247;stroke-opacity:.55;stroke-width:1;stroke-dasharray:3 4}
.sil{fill:#151E29;stroke:#5EC8FF;stroke-opacity:.45;stroke-width:1}
.base{fill:#2C3948;stroke:rgba(0,0,0,.72);stroke-width:.7;stroke-linejoin:round}
.mus{stroke:rgba(0,0,0,.72);stroke-width:.7;stroke-linejoin:round}
.vol{fill:url(#vol);stroke:url(#rim);stroke-width:.8;pointer-events:none}
.volHead{fill:url(#vol);pointer-events:none}
.fib{fill:none;stroke:rgba(255,255,255,.15);stroke-width:.5;stroke-linecap:round}
.ten{fill:none;stroke:#D3DEE8;stroke-opacity:.6;stroke-linecap:round}
.bone{fill:#DCE6EF;fill-opacity:.9;stroke:rgba(0,0,0,.4);stroke-width:.5}
.head{fill:#253140;stroke:#5EC8FF;stroke-opacity:.5;stroke-width:1}
.spec{fill:none;stroke:#BFE9FF;stroke-opacity:.35;stroke-width:1.2;stroke-linecap:round}
.plate{fill:rgba(169,182,198,.04);stroke:#A9B6C6;stroke-opacity:.55;stroke-width:1}
.node{fill:#E8F6FF;stroke:#5EC8FF;stroke-width:1.4}
.sheen{mix-blend-mode:screen;opacity:0}
.sP{animation-name:sheenP}.sS{animation-name:sheenS}.sX{animation-name:sheenX}
@keyframes sheenP{0%{opacity:0}50%{opacity:.15}72%{opacity:.4}83.33%{opacity:.05}100%{opacity:0}}
@keyframes sheenS{0%{opacity:0}50%{opacity:.1}72%{opacity:.25}100%{opacity:0}}
@keyframes sheenX{0%{opacity:0}72%{opacity:.08}100%{opacity:0}}
.svgLabel{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.08em;fill:#8C9AAD}
.cueText{font-family:'Chakra Petch',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.05em;fill:#E8EEF5}
.cueBox{fill:#0E1520;stroke:#5EC8FF;stroke-opacity:.5;stroke-width:.8}
.cueLead{stroke:#5EC8FF;stroke-opacity:.6;stroke-width:.8}

/* icon cross-fade: both mounted, scale .25→1, opacity, blur */
.ic{grid-area:1/1;transition:opacity 300ms var(--ease),scale 300ms var(--ease),filter 300ms var(--ease)}
[data-on="true"] .icPlay,[data-on="false"] .icPause{opacity:0;scale:.25;filter:blur(4px)}
[data-on="true"] .icPause,[data-on="false"] .icPlay{opacity:1;scale:1;filter:blur(0)}

.seg[data-active="true"]{background:#1A2533;color:#E8EEF5;border-color:#2E4054}
.seg[data-active="false"]{background:transparent;color:#8C9AAD;border-color:transparent}
.chip[data-selected="true"]{border-color:#7FD4FF;background:#101A26}
.chip[data-selected="false"]{border-color:#1C2430;background:#0B0F15}

@media (prefers-reduced-motion: reduce){
.rig,.ring{animation:none!important}
.sheen{opacity:0!important}
.phL,.depth,.cueKnee{opacity:1}
.ic{transition:none}
}
</style>

<script type="text/x-dc" data-dc-script data-props='{"prime":{"editor":"color","default":"#FF6A2B","options":["#FF6A2B","#FF3D6E","#B6FF3B"]},"$preview":{"width":390,"height":844}}'>
const BASE_REP_SECONDS = 6;
const ROLE = {
  primary: { label: 'PRIMARY', pulse: 'pP', sheen: 'sP' },
  secondary: { label: 'SECONDARY', pulse: 'pS', sheen: 'sS' },
  stabilizer: { label: 'STABILIZER', pulse: 'pX', sheen: 'sX' }
};
const MUSCLES = [
  { id: 'quads', name: 'Quads', role: 'primary', sampleSets: 14, about: 'Quadriceps · primary. Straighten the knee and peak driving out of the bottom.' },
  { id: 'glutes', name: 'Glutes', role: 'primary', sampleSets: 12, about: 'Glutes · primary. Extend the hip, working hardest below parallel.' },
  { id: 'adductors', name: 'Adductors', role: 'secondary', sampleSets: 8, about: 'Adductors · secondary. The big inner-thigh muscle helps the glutes drive the hip up out of the hole.' },
  { id: 'hams', name: 'Hamstrings', role: 'secondary', sampleSets: 6, about: 'Hamstrings · secondary. Steady the knee and help the hip extend.' },
  { id: 'erectors', name: 'Low back', role: 'stabilizer', sampleSets: 9, about: 'Spinal erectors · stabilizer. Hold your torso angle under the bar.' },
  { id: 'core', name: 'Core', role: 'stabilizer', sampleSets: 4, about: 'Core · stabilizer. Keeps pressure so the spine stays stacked.' },
  { id: 'upperback', name: 'Upper back', role: 'stabilizer', sampleSets: 10, about: 'Upper back · stabilizer. Lats and traps pin the bar tight so it does not drift forward.' },
  { id: 'calves', name: 'Calves', role: 'stabilizer', sampleSets: 2, about: 'Calves · stabilizer. Keep the whole foot planted.' }
];
const SECONDARY_COLOR = '#FFC247';
const STABILIZER_COLOR = '#A06E53';
const DIMMED_OPACITY = 0.12;
const loadColor = (sets) => {
  if (sets >= 12) return '#C2EEFF';
  if (sets >= 8) return '#4FC0FF';
  if (sets >= 4) return '#2F86C4';
  return '#1E4A6B';
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'activation', isPlaying: true, isHalfSpeed: false, focusId: null };
    this.togglePlay = () => this.setState({ isPlaying: !this.state.isPlaying });
    this.toggleSpeed = () => this.setState({ isHalfSpeed: !this.state.isHalfSpeed });
    this.showActivation = () => this.setState({ mode: 'activation' });
    this.showLoad = () => this.setState({ mode: 'load' });
  }
  renderVals() {
    const { mode, isPlaying, isHalfSpeed, focusId } = this.state;
    const prime = this.props.prime ?? '#FF6A2B';
    const isLoad = mode === 'load';
    const roleColor = { primary: prime, secondary: SECONDARY_COLOR, stabilizer: STABILIZER_COLOR };
    const fill = {}; const op = {}; const pulse = {}; const sheen = {};
    MUSCLES.forEach((m) => {
      fill[m.id] = isLoad ? loadColor(m.sampleSets) : roleColor[m.role];
      op[m.id] = focusId && focusId !== m.id ? DIMMED_OPACITY : 1;
      pulse[m.id] = isLoad ? 'pX' : ROLE[m.role].pulse;
      sheen[m.id] = isLoad ? 'sX' : ROLE[m.role].sheen;
    });
    const chips = MUSCLES.map((m) => ({
      name: m.name,
      color: fill[m.id],
      meta: isLoad ? m.sampleSets + ' SETS' : ROLE[m.role].label,
      selectedStr: String(focusId === m.id),
      pick: () => this.setState({ focusId: this.state.focusId === m.id ? null : m.id })
    }));
    const focused = MUSCLES.find((m) => m.id === focusId);
    const info = focused
      ? (isLoad ? focused.name + ' · ' + focused.sampleSets + ' sets logged this week (sample data).' : focused.about)
      : (isLoad ? 'Sample week: each muscle is shaded by the sets you logged. Brighter means more work this week.' : 'Warm means working: orange primary, amber secondary, copper stabilizers. The glow peaks as you drive out of the hole. Tap one to isolate it.');
    return {
      dur: (isHalfSpeed ? BASE_REP_SECONDS * 2 : BASE_REP_SECONDS) + 's',
      playState: isPlaying ? 'running' : 'paused',
      playingStr: String(isPlaying),
      playLabel: isPlaying ? 'Pause' : 'Play',
      speedLabel: isHalfSpeed ? '½×' : '1×',
      isActivation: String(!isLoad),
      isLoad: String(isLoad),
      togglePlay: this.togglePlay,
      toggleSpeed: this.toggleSpeed,
      showActivation: this.showActivation,
      showLoad: this.showLoad,
      fill: fill, op: op, pulse: pulse, sheen: sheen, chips: chips, info: info
    };
  }
}
</script>
