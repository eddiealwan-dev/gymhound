plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.grunthound.gymhound'
version = '1.0.0'

android {
  namespace "expo.modules.gymhoundrestongoing"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // NotificationCompat, NotificationManagerCompat, ContextCompat. Same version expo-notifications 57 uses.
  implementation 'androidx.core:core:1.17.0'
}
